spring.application.name=feed_api

# The challenge configures the server only through env vars
server.address=${HOST:127.0.0.1}
server.port=${PORT:3000}
# Nginx
server.tomcat.keep-alive-timeout=65s

# SQLITE
spring.datasource.url=jdbc:sqlite:${SQLITE_PATH:feed.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# I added the community dialect because Hibernate does not support SQLite by default
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# The schema is fixed, so hibernate doesn't have to change anythin
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
# The database session closes when the service method ends
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:twelve-dollar-challenge}
